display_information:
  name: Terminal Slack
  description: Personal terminal client
oauth_config:
  scopes:
    user:
      - channels:history
      - channels:read
      - channels:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - mpim:write
      - chat:write
      - reactions:read
      - reactions:write
      - users:read
      - users:read.email
      - users:write
      - users.profile:read
      - users.profile:write
      - usergroups:read
      - team:read
      - dnd:read
      - dnd:write
      - search:read
      - files:read
      - files:write
      - emoji:read
      - pins:read
      - pins:write
      - bookmarks:read
      - bookmarks:write
settings:
  event_subscriptions:
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      - channel_created
      - channel_rename
      - channel_archive
      - channel_unarchive
      - member_joined_channel
      - member_left_channel
      - pin_added
      - pin_removed
      - emoji_changed
      - user_change
      - dnd_updated
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
